<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navodaya Model Quiz - Crack the Exam</title>
  <style>
    :root {
      --primary: #60a5fa;
      --primary-dark: #0f172a;
      --secondary: #2dd4bf;
      --success: #22c55e;
      --wrong: #ef4444;
      --warning: #fbbf24;
      --bg: #020817;
      --card: #0f172a;
      --text: #e2e8f0;
      --muted: #cbd5e1;
      --shadow: 0 14px 28px rgba(2, 8, 23, 0.45);
      --panel: #111827;
      --panel-strong: #1f2937;
      --option-bg: #0b1220;
      --option-border: #334155;
      --feedback-correct-bg: rgba(34, 197, 94, 0.12);
      --feedback-wrong-bg: rgba(239, 68, 68, 0.12);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
      color: var(--text);
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, #2563eb 40%, #0ea5e9 100%);
      color: white;
      text-align: center;
      padding: 32px 20px 24px;
      box-shadow: var(--shadow);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    header p {
      margin: 0;
      font-size: 1.05rem;
      opacity: 0.95;
    }

    .sticky-score {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 auto;
      max-width: 1200px;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.96);
      color: white;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .score-box {
      font-weight: 700;
      font-size: 1rem;
      color: #f8fafc;
    }

    .score-box strong {
      color: #fef3c7;
    }

    .restart-btn {
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--warning), #f97316);
      color: #111827;
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(249, 115, 22, 0.35);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 24px auto 16px;
    }

    nav a {
      text-decoration: none;
      color: white;
      background: var(--primary-dark);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 6px 12px rgba(15, 23, 42, 0.15);
    }

    .exam-section {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.9));
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
      border-left: 8px solid var(--primary);
      color: var(--text);
    }

    .exam-section h2 {
      margin: 0 0 4px;
      font-size: clamp(1.5rem, 2vw, 2rem);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: #f8fafc;
    }

    .badge {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #1f2937;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .meta-info {
      margin: 0 0 18px;
      color: #dbeafe;
      font-style: italic;
    }

    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .question-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(17, 24, 39, 0.95));
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 14px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      color: #f8fafc;
    }

    .question-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(180deg, var(--primary), var(--secondary));
    }

    .q-text {
      margin: 0 0 14px;
      font-weight: 700;
      line-height: 1.5;
      color: #f8fafc;
    }

    .option-btn {
      width: 100%;
      border: 1px solid var(--option-border);
      background: var(--option-bg);
      color: #f8fafc;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 0.96rem;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.08);
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 1;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--success);
      color: #dcfce7;
      font-weight: 700;
    }

    .option-btn.incorrect {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--wrong);
      color: #fee2e2;
      font-weight: 700;
    }

    .feedback {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: #f8fafc;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: var(--feedback-correct-bg);
      color: #dcfce7;
      border: 1px solid rgba(34, 197, 94, 0.45);
    }

    .feedback.incorrect {
      background: var(--feedback-wrong-bg);
      color: #fee2e2;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    .next-btn {
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: white;
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
      display: inline-block;
    }

    .next-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-banner {
      display: none;
      margin-top: 18px;
      padding: 18px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.18), rgba(45, 212, 191, 0.12));
      border: 1px solid rgba(96, 165, 250, 0.45);
      font-weight: 700;
      color: #f8fafc;
      text-align: center;
    }

    .result-banner.show {
      display: block;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 999;
    }

    .paper-piece {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      opacity: 0.9;
      animation: fall 1.6s ease-out forwards;
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate3d(var(--dx), 150vh, 0) rotate(var(--rot)) scale(0.8);
        opacity: 0;
      }
    }

    @media (max-width: 640px) {
      .sticky-score {
        padding: 12px 14px;
      }
      .restart-btn {
        padding: 8px 12px;
      }
      .exam-section {
        padding: 18px 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Navodaya First Class Model Quiz</h1>
    <p>5 Sections • 10 Questions Each • Full Topic Coverage • Correct Answers Trigger Confetti + Sound</p>
  </header>

  <div class="sticky-score">
    <div class="score-box">Score: <strong id="score">0</strong> / <span id="total">50</span></div>
    <button class="restart-btn" id="restartBtn">Restart Quiz</button>
  </div>

  <div class="container">
    <nav>
      <a href="#mental-ability">Mental Ability</a>
      <a href="#arithmetic">Arithmetic</a>
      <a href="#language">Language</a>
      <a href="#science">General Science</a>
      <a href="#social-studies">Social Studies</a>
    </nav>

    <main id="app"></main>
  </div>

  <div class="confetti-layer" id="confettiLayer"></div>

  <script>
    const quizData = {
      'mental-ability': {
        title: 'Mental Ability Test',
        weight: 'Patterns, Counting, and Logic',
        questions: [
          { q: 'What comes next: 1, 2, 3, 4, ?', options: ['5', '6', '7', '8'], answer: 0 },
          { q: 'Which is bigger: 9 or 5?', options: ['9', '5', 'Both same', 'None'], answer: 0 },
          { q: 'Find the odd one out: apple, banana, mango, chair', options: ['Apple', 'Banana', 'Mango', 'Chair'], answer: 3 },
          { q: 'Which shape has 3 sides?', options: ['Circle', 'Triangle', 'Square', 'Rectangle'], answer: 1 },
          { q: 'What is the opposite of big?', options: ['Tall', 'Small', 'Long', 'Wide'], answer: 1 },
          { q: 'Complete the pattern: circle, square, circle, square, ?', options: ['Circle', 'Triangle', 'Star', 'Rectangle'], answer: 0 },
          { q: 'Which number is before 10?', options: ['9', '10', '11', '12'], answer: 0 },
          { q: 'A cat says:', options: ['Moo', 'Meow', 'Roar', 'Bark'], answer: 1 },
          { q: 'How many wheels does a bicycle have?', options: ['1', '2', '3', '4'], answer: 1 },
          { q: 'Which one is longer?', options: ['Pen', 'Pencil', 'Stick', 'Needle'], answer: 2 }
        ]
      },
      arithmetic: {
        title: 'Arithmetic Test',
        weight: 'Numbers and Simple Sums',
        questions: [
          { q: '2 + 3 = ?', options: ['4', '5', '6', '7'], answer: 1 },
          { q: '5 - 2 = ?', options: ['2', '3', '4', '5'], answer: 1 },
          { q: 'What is 4 + 4?', options: ['6', '7', '8', '9'], answer: 2 },
          { q: 'Which number is 1 more than 7?', options: ['6', '7', '8', '9'], answer: 2 },
          { q: 'Which number is 2 less than 9?', options: ['6', '7', '8', '9'], answer: 1 },
          { q: '3 + 2 + 1 = ?', options: ['5', '6', '7', '8'], answer: 1 },
          { q: '10 - 5 = ?', options: ['3', '4', '5', '6'], answer: 2 },
          { q: 'A box has 6 apples. 2 are taken away. How many left?', options: ['3', '4', '5', '6'], answer: 2 },
          { q: 'How many fingers are on one hand?', options: ['4', '5', '6', '10'], answer: 1 },
          { q: 'Double of 3 is:', options: ['3', '5', '6', '9'], answer: 2 }
        ]
      },
      language: {
        title: 'Language Test',
        weight: 'Letters, Words, and Sentences',
        questions: [
          { q: 'Which is a vowel?', options: ['B', 'A', 'C', 'D'], answer: 1 },
          { q: 'What is the first letter of the word “ball”?', options: ['B', 'A', 'L', 'D'], answer: 0 },
          { q: 'Which word rhymes with “cat”?', options: ['Dog', 'Hat', 'Ball', 'Sun'], answer: 1 },
          { q: 'Choose the correct sentence.', options: ['I goes to school.', 'I go to school.', 'I going to school.', 'I am school.'], answer: 1 },
          { q: 'The opposite of “hot” is:', options: ['Warm', 'Cold', 'Fast', 'Big'], answer: 1 },
          { q: 'What is the plural of “book”?', options: ['Books', 'Bookes', 'Book', 'Booksies'], answer: 0 },
          { q: 'Which word is a name of a person?', options: ['Table', 'Riya', 'Chair', 'River'], answer: 1 },
          { q: 'Complete the word: c__t', options: ['at', 'an', 'ot', 'it'], answer: 0 },
          { q: 'Which word starts with the letter S?', options: ['Apple', 'Sun', 'Tree', 'Book'], answer: 1 },
          { q: 'Choose the correct spelling:', options: ['School', 'Scool', 'Schol', 'Schoool'], answer: 0 }
        ]
      },
      science: {
        title: 'General Science',
        weight: 'Nature, Body, and Living Things',
        questions: [
          { q: 'Which of these is a plant?', options: ['Tree', 'Stone', 'Car', 'Book'], answer: 0 },
          { q: 'We drink:', options: ['Milk', 'Sand', 'Stone', 'Paper'], answer: 0 },
          { q: 'Which part of the body do we use to see?', options: ['Ear', 'Eyes', 'Hands', 'Feet'], answer: 1 },
          { q: 'Which animal gives milk?', options: ['Cow', 'Lion', 'Tiger', 'Duck'], answer: 0 },
          { q: 'The Sun gives us:', options: ['Light and heat', 'Snow and ice', 'Water and sand', 'Stone and mud'], answer: 0 },
          { q: 'Which is a living thing?', options: ['Tree', 'Toy', 'Stone', 'Table'], answer: 0 },
          { q: 'Which part of the body do we use to walk?', options: ['Legs', 'Ears', 'Hands', 'Nose'], answer: 0 },
          { q: 'Which gas do we breathe in?', options: ['Oxygen', 'Milk', 'Stone', 'Salt'], answer: 0 },
          { q: 'A butterfly lives in:', options: ['Water', 'Air', 'Tree', 'Soil'], answer: 2 },
          { q: 'We need food to:', options: ['Sleep', 'Play and grow', 'Paint', 'Run only'], answer: 1 }
        ]
      },
      'social-studies': {
        title: 'Social Studies',
        weight: 'Family, School, and Country',
        questions: [
          { q: 'Who is in your family?', options: ['Parents', 'Books', 'Chairs', 'Bags'], answer: 0 },
          { q: 'Where do you go to study?', options: ['School', 'Hospital', 'Market', 'Farm'], answer: 0 },
          { q: 'Which festival is known as the Festival of Lights?', options: ['Diwali', 'Holi', 'Christmas', 'Eid'], answer: 0 },
          { q: 'Which is our national flag color?', options: ['Red and white', 'Saffron, white, green', 'Blue and yellow', 'Black and blue'], answer: 1 },
          { q: 'Who helps us when we are sick?', options: ['Doctor', 'Farmer', 'Driver', 'Teacher'], answer: 0 },
          { q: 'Our country is:', options: ['India', 'China', 'America', 'England'], answer: 0 },
          { q: 'Which is the capital of India?', options: ['Mumbai', 'Delhi', 'Chennai', 'Kolkata'], answer: 1 },
          { q: 'Which direction is where the Sun rises?', options: ['West', 'East', 'North', 'South'], answer: 1 },
          { q: 'Who teaches in school?', options: ['Teacher', 'Doctor', 'Driver', 'Cook'], answer: 0 },
          { q: 'Which is a helper at home?', options: ['Mother', 'Stone', 'Tree', 'Book'], answer: 0 }
        ]
      }
    };

    const questionQueue = [];
    Object.entries(quizData).forEach(([key, section], sectionIndex) => {
      section.questions.forEach((question, questionIndex) => {
        questionQueue.push({
          key,
          sectionTitle: section.title,
          sectionIndex: sectionIndex + 1,
          qIndex: questionIndex + 1,
          question: question.q,
          options: question.options,
          answer: question.answer
        });
      });
    });

    const totalQuestions = questionQueue.length;
    document.getElementById('total').textContent = totalQuestions;

    const app = document.getElementById('app');
    const scoreEl = document.getElementById('score');
    let currentScore = 0;
    let currentIndex = 0;
    let answered = new Set();

    function renderQuestion() {
      const q = questionQueue[currentIndex];
      const overallNumber = currentIndex + 1;

      app.innerHTML = `
        <section class="exam-section" style="border-left-color:${['#ef4444','#f59e0b','#10b981','#8b5cf6','#14b8a6'][q.sectionIndex - 1]}">
          <h2>Section ${q.sectionIndex}: ${q.sectionTitle}</h2>
          <p class="meta-info">Question ${overallNumber} of ${totalQuestions}</p>
          <div class="question-card">
            <p class="q-text">Q${overallNumber}. ${q.question}</p>
            <div class="option-group">
              ${q.options.map((option, idx) => `
                <button class="option-btn" type="button" data-index="${idx}">
                  ${String.fromCharCode(65 + idx)}) ${option}
                </button>
              `).join('')}
            </div>
            <div class="feedback"></div>
            <button id="nextBtn" class="next-btn" disabled>Next Question</button>
          </div>
        </section>
      `;

      bindCurrentQuestion();
    }

    function bindCurrentQuestion() {
      const q = questionQueue[currentIndex];
      const buttons = document.querySelectorAll('.option-btn');
      const feedback = document.querySelector('.feedback');
      const nextBtn = document.getElementById('nextBtn');

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          if (answered.has(currentIndex)) return;
          answered.add(currentIndex);

          const selectedIndex = Number(button.dataset.index);
          const isCorrect = selectedIndex === q.answer;

          buttons.forEach((btn) => {
            btn.disabled = true;
            if (Number(btn.dataset.index) === q.answer) {
              btn.classList.add('correct');
            }
          });

          if (isCorrect) {
            button.classList.add('correct');
            currentScore += 1;
            scoreEl.textContent = currentScore;
            feedback.className = 'feedback show correct';
            feedback.textContent = '✅ Correct! Great job — keep the momentum going.';
            launchConfetti();
            playCorrectSound();
          } else {
            button.classList.add('incorrect');
            feedback.className = 'feedback show incorrect';
            feedback.textContent = `❌ Not quite. The correct answer is ${String.fromCharCode(65 + q.answer)}.`;
          }

          nextBtn.disabled = false;
          nextBtn.textContent = currentIndex === totalQuestions - 1 ? 'See Final Result' : 'Next Question';
        });
      });

      nextBtn.addEventListener('click', () => {
        if (currentIndex < totalQuestions - 1) {
          currentIndex += 1;
          renderQuestion();
        } else {
          app.innerHTML = `
            <section class="exam-section">
              <h2>Quiz Complete</h2>
              <p class="meta-info">You have finished all 50 questions.</p>
              <div class="question-card">
                <p class="q-text">Final Score: <strong>${currentScore}</strong> / ${totalQuestions}</p>
                <p class="q-text">${currentScore >= 35 ? 'Excellent work! You are well prepared for Navodaya practice.' : currentScore >= 25 ? 'Good progress. Keep practicing to improve your accuracy.' : 'Keep learning and try again. Every question helps you improve.'}</p>
                <button id="restartBtn2" class="next-btn">Restart Quiz</button>
              </div>
            </section>
          `;

          document.getElementById('restartBtn2').addEventListener('click', () => {
            currentScore = 0;
            currentIndex = 0;
            answered = new Set();
            scoreEl.textContent = '0';
            renderQuestion();
          });
        }
      });
    }

    function launchConfetti() {
      const layer = document.getElementById('confettiLayer');
      const colors = ['#fbbf24', '#22c55e', '#60a5fa', '#f472b6', '#fb7185', '#34d399'];

      for (let i = 0; i < 40; i++) {
        const piece = document.createElement('span');
        piece.className = 'paper-piece';
        piece.style.left = Math.random() * window.innerWidth + 'px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
        piece.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        layer.appendChild(piece);
        setTimeout(() => piece.remove(), 1700);
      }
    }

    function playCorrectSound() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      const audioCtx = new AudioCtor();
      const notes = [523.25, 659.25, 783.99];

      notes.forEach((freq, index) => {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = freq;
        gainNode.gain.value = 0.0001;
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const start = audioCtx.currentTime + index * 0.12;
        oscillator.start(start);
        gainNode.gain.exponentialRampToValueAtTime(0.12, start + 0.04);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
        oscillator.stop(start + 0.4);
      });
    }

    document.getElementById('restartBtn').addEventListener('click', () => {
      currentScore = 0;
      currentIndex = 0;
      answered = new Set();
      scoreEl.textContent = '0';
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
